name: Cross-Architecture Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [32-bit, 64-bit]

    steps:
      - uses: actions/checkout@v4

      - name: Set up (or not) QEMU
        if: matrix.arch != 'x64'
        uses: docker/setup-qemu-action@v3

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run Tests on ${{ matrix.arch }}
        run: bun test
